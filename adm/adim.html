```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CasaShop - Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <h1>🔐 CasaShop</h1>

    <p>Painel Administrativo</p>

    <a
        href="test.html"
        class="link-admin"
    >
        🏠 Voltar para Loja
    </a>

</header>


<div class="container">


    <!-- RESUMO -->

    <div class="box">

        <h2>📊 Resumo</h2>

        <div class="grid">

            <div class="box">

                <p>📦 Produtos</p>

                <h2 id="totalProdutos">
                    0
                </h2>

            </div>


            <div class="box">

                <p>🧾 Vendas</p>

                <h2 id="totalVendas">
                    0
                </h2>

            </div>


            <div class="box">

                <p>💰 Faturamento</p>

                <h2 id="faturamento">
                    R$ 0,00
                </h2>

            </div>

        </div>

    </div>


    <!-- ADICIONAR PRODUTO -->

    <div class="box">

        <h2>➕ Adicionar Produto</h2>

        <input
            type="text"
            id="nomeProduto"
            placeholder="Nome do produto"
        >

        <input
            type="number"
            id="precoProduto"
            placeholder="Preço"
            step="0.01"
            min="0"
        >

        <input
            type="text"
            id="categoriaProduto"
            placeholder="Categoria"
        >

        <input
            type="number"
            id="estoqueProduto"
            placeholder="Estoque"
            min="0"
        >

        <input
            type="text"
            id="imagemProduto"
            placeholder="Link da imagem"
        >

        <button
            onclick="adicionarProduto()"
        >
            ➕ Adicionar Produto
        </button>

    </div>


    <!-- PRODUTOS -->

    <div class="box">

        <h2>📦 Produtos cadastrados</h2>

        <div
            id="listaProdutos"
        ></div>

    </div>


    <!-- PEDIDOS -->

    <div class="box">

        <h2>🧾 Pedidos</h2>

        <div
            id="listaPedidos"
        ></div>

    </div>


    <!-- HISTÓRICO -->

    <div class="box">

        <h2>📊 Histórico de Vendas</h2>

        <div
            id="historico"
        ></div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>


<script src="admin.js"></script>


</body>

</html>
```
