<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CasaShop Loja</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>

<body>

<header>

    <h1>🛒 CasaShop Loja</h1>

    <p>
        Compre seus produtos de forma fácil e rápida
    </p>

    <a
        href="admin.html"
        class="link-admin"
    >
        🔐 Painel Administrativo
    </a>

</header>


<div class="container">

    <!-- FILTROS -->

    <div class="box">

        <h2>🔎 Procurar produtos</h2>

        <input
            type="text"
            id="busca"
            placeholder="Digite o nome do produto..."
            oninput="render()"
        >

        <select
            id="categoria"
            onchange="render()"
        >

            <option value="">
                Todas as categorias
            </option>

        </select>

    </div>


    <!-- PRODUTOS -->

    <h2>📦 Produtos</h2>

    <div
        id="produtos"
        class="grid"
    ></div>


    <!-- CARRINHO -->

    <div class="carrinho">

        <h2>🛒 Carrinho</h2>

        <div id="carrinho"></div>

        <div
            id="total"
            class="total"
        >
            Total: R$ 0,00
        </div>

        <button
            class="finalizar"
            onclick="abrirFinalizacao()"
        >
            💳 Finalizar Compra
        </button>

        <button
            class="remover"
            onclick="limparCarrinho()"
        >
            🗑️ Limpar Carrinho
        </button>

    </div>


    <!-- RASTREAMENTO -->

    <div class="box rastreamento">

        <h2>🚚 Rastrear Pedido</h2>

        <input
            type="text"
            id="pedidoRastreamento"
            placeholder="Número do pedido"
        >

        <button
            onclick="rastrearPedido()"
        >
            📍 Rastrear
        </button>

        <div
            id="statusEntrega"
            class="status"
        >
            Digite o número do pedido.
        </div>

        <div id="mapa"></div>

    </div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-conteudo">

        <h2>🧾 Finalizar Compra</h2>

        <div id="resumoCompra"></div>

        <h3>💳 Forma de Pagamento</h3>

        <select id="pagamento">

            <option value="Pix">
                Pix
            </option>

            <option value="Cartão de Crédito">
                Cartão de Crédito
            </option>

            <option value="Cartão de Débito">
                Cartão de Débito
            </option>

            <option value="Dinheiro">
                Dinheiro
            </option>

        </select>

        <button
            onclick="finalizarCompra()"
        >
            ✅ Confirmar Compra
        </button>

        <button
            class="fechar"
            onclick="fecharModal()"
        >
            ❌ Cancelar
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>


<!-- MAPA -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script src="script.js"></script>

</body>

</html>
